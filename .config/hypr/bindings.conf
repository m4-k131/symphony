# ╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═════╝ ╚═╝╚═╝  ╚═══╝╚═════╝ ╚═╝╚═╝  ╚═══╝ ╚═════╝ ╚══════╝

# Assign apps
$terminal = kitty
$browser = $HOME/.config/hypr/scripts/launch-browser
$browser2 = zen-browser
$webapp = ~/.config/hypr/scripts/launch-webapp
$focus = ~/.config/hypr/scripts/focus
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Assign Dir
$rofiDir = ~/.config/rofi/scripts
$scrDir = ~/.config/hypr/scripts

# ── Applications ──────────────────────────────────────────────────
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- $terminal --dir="$HOME"
bindd = SUPER, B, Browser, exec,  $browser
bindd = SUPER, E, File manager, exec, uwsm app -- dolphin --new-window
bindd = SUPER, D, App Launcher, exec, pkill rofi || rofi -show drun
bindd = SUPER, M, Music (rmpc), exec, $terminal -e rmpc
bindd = SUPER, S, Volume mixer (wiremix), exec, $terminal --class=Wiremix -e wiremix
bindd = SUPER, O, Devin, exec, ~/apps/Devin/devin-desktop
bindd = SUPER, I, Symphony TUI, exec, kitty --title symphony-tui -e symphony-tui
bindd = SUPER, N, Notification centre, exec, swaync-client -t -sw
bindd = SUPER, K, Show all keybindings, exec, $rofiDir/keyhints
bindd = SUPER, Q, Close window, killactive,

# ── Terminal Apps (ALT + key) ─────────────────────────────────────
bindd = ALT, slash, Activity monitor (btop), exec, $terminal -e btop
bindd = ALT, Q, yazi, exec, $terminal -e yazi
bindd = ALT, N, Neovim, exec, $terminal -e nvim
bindd = ALT, M, easyeffects, exec, easyeffects

# ── Tmux ──────────────────────────────────────────────────────────
bind = SUPER SHIFT, return, exec, $terminal -e tmux a
bind = SUPER ALT, return, exec, $terminal -e tmux new -As main

# ── Rofi Launchers ────────────────────────────────────────────────
bindd = SUPER, SPACE, App launcher, exec, pkill rofi || rofi -show drun
bindd = ALT, SPACE, Find, exec, $rofiDir/rofisearch
bindd = ALT, comma, Clipboard, exec, $rofiDir/clipboard
bindd = ALT, period, Emoji, exec, $rofiDir/emoji
bindd = SUPER CTRL, B, Power profiles, exec, $rofiDir/power-profiles
bindd = SUPER SHIFT, N, Wifi menu, exec, $rofiDir/wifi.sh

# ── Themes & Wallpapers (SUPER + CTRL + key) ─────────────────────
bindd = SUPER CTRL, T, Theme switcher, exec, symphony switch
bindd = SUPER CTRL SHIFT, T, Random theme, exec, symphony switch --random
bindd = SUPER CTRL, W, Wallpaper picker, exec, $rofiDir/wallPicker
bindd = SUPER CTRL SHIFT, W, Matugen themes apply, exec, $rofiDir/selectWall
bindd = SUPER CTRL, C, Color scheme picker, exec, $rofiDir/schemePicker
bindd = SUPER CTRL, R, Regenerate theme, exec, $scrDir/change-theme
bindd = SUPER SHIFT, I, Browse themes, exec, kitty --title symphony-browse -e symphony browse

# Wallpaper cycling
bindd = SUPER ALT, up, Theme wallpapers, exec, $scrDir/cycle-wallpaper
bindd = SUPER ALT, right, Next wallpaper, exec, $scrDir/cycle-wallpaper next
bindd = SUPER ALT, left, Previous wallpaper, exec, $scrDir/cycle-wallpaper prev

# ── Capture ───────────────────────────────────────────────────────
bindd = SUPER, P, Screenshot with editing, exec, $scrDir/screenshot
bindd = , PRINT, Screenshot with editing, exec, $scrDir/screenshot
bindd = SHIFT, PRINT, Screenshot to clipboard, exec, $scrDir/screenshot smart clipboard
bindd = SUPER SHIFT, P, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER, R, Record screen, exec, $scrDir/screenrecord --with-desktop-audio
bindd = SUPER SHIFT, R, Record + mic, exec, $scrDir/screenrecord --with-microphone-audio
bindd = SUPER ALT, R, Record + mic + webcam, exec, ~/Scripts/screenrecord --with-desktop-audio --with-microphone-audio --with-webcam

# ── Monitors (SUPER + SHIFT + F-key) ─────────────────────────────
bindd = SUPER SHIFT, M, Monitor switch menu, exec, $rofiDir/monitor-switch
bindd = SUPER SHIFT, F1, Both monitors, exec, $rofiDir/monitor-switch both
bindd = SUPER SHIFT, F2, Only monitor 1, exec, $rofiDir/monitor-switch only1
bindd = SUPER SHIFT, F3, Only monitor 2, exec, $rofiDir/monitor-switch only2
bindd = SUPER CTRL, M, Move all to other monitor, exec, $scrDir/move-all-to-other-monitor
bindd = SUPER, F1, Toggle monitor power, exec, $scrDir/toggle-monitor

# ── Brightness ────────────────────────────────────────────────────
bindd = SUPER CTRL, up, Monitor brightness up, exec, $scrDir/brightness up
bindd = SUPER CTRL, down, Monitor brightness down, exec, $scrDir/brightness down
bindd = SUPER ALT, XF86AudioRaiseVolume, Laptop brightness up, exec, $osdclient --brightness raise
bindd = SUPER ALT, XF86AudioLowerVolume, Laptop brightness down, exec, $osdclient --brightness lower
bindd = SUPER, XF86AudioRaiseVolume, External monitor brightness up, exec, $scrDir/brightness up
bindd = SUPER, XF86AudioLowerVolume, External monitor brightness down, exec, $scrDir/brightness down

# ── System & Power ────────────────────────────────────────────────
bindd = SUPER, ESCAPE, Power menu, exec, $rofiDir/powermenu
bindld = , XF86PowerOff, Power menu, exec, $rofiDir/powermenu
bindd = SUPER SHIFT, L, Lock screen, exec, loginctl lock-session
bindd = SUPER SHIFT, ESCAPE, Logout, exec, $scrDir/graceful-logout
bindd = SUPER CTRL, ESCAPE, Reboot, exec, $scrDir/graceful-reboot
bindd = SUPER SHIFT, K, Kill application, exec, hyprctl kill

# ── System Toggles ────────────────────────────────────────────────
bindd = SUPER SHIFT, O, Pop window out (float & pin), exec, $scrDir/pop-window
bind = SUPER SHIFT, SPACE, exec, $scrDir/toggle-waybar
bind = SUPER CTRL, N, exec, $scrDir/nightlight
bindd = SUPER, BACKSPACE, Terminal transparency, exec, $scrDir/toggle-terminal-transparency
bindd = SUPER CTRL, BACKSPACE, Toggle focus & vibe mode, exec, $scrDir/toggle-focus

# ── File Sharing (LocalSend) ─────────────────────────────────────
bind = SUPER ALT, S, exec, kitty --title share -e $scrDir/fileshare file
bind = SUPER CTRL, S, exec, kitty --title share -e $scrDir/fileshare folder
bind = SUPER SHIFT, S, exec, kitty --title share -e $scrDir/fileshare clipboard

