# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, $osdclient --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $scrDir/brightness up
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $scrDir/brightness down

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $osdclient --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $osdclient --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, $scrDir/brightness set $(($(cat ~/.cache/brightness 2>/dev/null || echo 50) + 1))
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, $scrDir/brightness set $(($(cat ~/.cache/brightness 2>/dev/null || echo 50) - 1))

# Media keys (MX Keys F8/F9/F10 Fn layer) — control MPD via rmpc
bindld = , XF86AudioPlay, Play/Pause, exec, rmpc togglepause
bindld = , XF86AudioPause, Play/Pause, exec, rmpc togglepause
bindld = , XF86AudioNext, Next track, exec, rmpc next
bindld = , XF86AudioPrev, Previous track, exec, rmpc prev

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, $scrDir/audio-switch

# Calculator (MX Keys calculator key)
bindd = , XF86Calculator, Calculator, exec, kcalc

# mpc (via rmpc CLI)
bindd = SUPER, F9, mpc pause, exec, rmpc pause
bindd = SUPER, F10, mpc prev, exec, rmpc prev
bindd = SUPER, F11, mpc play, exec, rmpc play
bindd = SUPER, F12, mpc next, exec, rmpc next
